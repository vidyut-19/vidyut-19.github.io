<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.5">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
        <title>Vidyut Baradwaj</title>
    </head>
<body>
    <header>
        <div class="header-container">
            <h1><a href="index.html">Vidyut Baradwaj</a> / Socials</h1>
            <button id="theme-toggle">🌙</button>
        </div>
    </header>
    
    <ul class="social-media-list">
        <li>
            <a href="https://twitter.com/vidyutbaradwaj">
                <i class="fab fa-twitter"></i>
                <span>Twitter</span>
            </a>
        </li>
        <li>
            <a href="https://www.instagram.com/vidyut.pdf/">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
        </li>
        <li>
            <a href="https://www.linkedin.com/in/vidyut-baradwaj">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>
        </li>
        <li>
            <a href="https://github.com/vidyut-19">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>
        </li>
    </ul>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        
        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.classList.add(savedTheme);
            themeToggle.textContent = savedTheme === 'dark-theme' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark-theme' : '');
        });
    </script>
</body>
</html>
