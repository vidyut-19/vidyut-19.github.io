        <!-- Prevent theme flash -->
        <script>
            (function () {
                var t = localStorage.getItem("theme");
                if (t) {
                    document.documentElement.classList.add(t);
                    document.body && document.body.classList.add(t);
                }
            })();
        </script>
        <!-- Preconnect to external origins -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />

        />
