<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tufte-blog.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bitmaks/cm-web-fonts@latest/fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
    <title>{{title}} - Vidyut Baradwaj</title>
</head>
<body class="tufte-post">
    <header id="banner">
        <div class="header-container">
            <div class="header-left">
                <h1><a href="../index.html">Vidyut Baradwaj</a> <span class="slash-title">/ Essays</span></h1>
            </div>
            <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
        </div>
    </header>

    <article class="tufte-article">
        <header class="article-header">
            <h1>{{title}}</h1>
            {{#description}}<p class="subtitle">{{description}}</p>{{/description}}
            <time datetime="{{date}}">{{formatted_date}}</time>
        </header>

        <section>
{{content}}
        </section>
    </article>

    <footer id="footer">
        <p>
            <a href="../essays.html">Essays</a>
            <a href="../projects.html">Projects</a>
            <a href="../contact.html">Socials</a>
        </p>
        <p>2025 Vidyut Baradwaj.</p>
    </footer>

    <script>
        const updateBannerOffset = () => {
            const y = window.scrollY || window.pageYOffset;
            const x = Math.sin(y / 120) * 80;
            document.body.style.setProperty('--vb-banner-offset', (y % 120) + 'px');
            document.body.style.setProperty('--vb-banner-x-offset', x + 'px');
        };
        window.addEventListener('scroll', updateBannerOffset, { passive: true });
        updateBannerOffset();

        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const renderIcon = () => {
            const isDark = document.body.classList.contains('dark-theme');

            themeToggle.innerHTML = isDark
                ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="19" rx="5" ry="2"/><path d="M7 19v-3c0-1 1-2 2-3l1-2h4l1 2c1 1 2 2 2 3v3"/><path d="M10 11V7c0-1 1-2 2-2s2 1 2 2v4"/><path d="M12 5c0-1.5-1-3-1-3s2 0 2 2"/></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="10" width="6" height="11" rx="1"/><path d="M10 10V9a2 2 0 1 1 4 0v1"/><ellipse cx="12" cy="6" rx="2" ry="3"/><path d="M12 3c0-1 .5-2 .5-2s.5 1 .5 2"/></svg>';
        };

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.classList.add(savedTheme);
            renderIcon();
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark-theme' : '');
            renderIcon();
        });
        if (!savedTheme) renderIcon();
    </script>

    <!-- KaTeX auto-render -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ]
        });"></script>
</body>
</html>
