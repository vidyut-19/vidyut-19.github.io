<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevent theme flash -->
    <script>(function(){var t=localStorage.getItem('theme');if(t){document.documentElement.classList.add(t);document.body&&document.body.classList.add(t);}})();</script>
    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tufte-blog.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bitmaks/cm-web-fonts@latest/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
    <title>{{title}} - Vidyut Baradwaj</title>
</head>
<body class="tufte-post">
    <header id="banner">
        <div class="header-container">
            <div class="header-left">
                <h1><a href="../index.html">Vidyut Baradwaj</a> <span class="slash-title">/ Essays</span></h1>
            </div>
            <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
        </div>
    </header>

    <article class="tufte-article">
        <header class="article-header">
            <h1>{{title}}</h1>
            {{#description}}<p class="subtitle">{{description}}</p>{{/description}}
            <time datetime="{{date}}">{{formatted_date}}</time>
        </header>

        <section>
{{content}}
        </section>
    </article>

    <footer id="footer">
        <p>
            <a href="../essays.html">Essays</a>
            <a href="../projects.html">Projects</a>
            <a href="../contact.html">Socials</a>
        </p>
        <p>2025 Vidyut Baradwaj.</p>
    </footer>

    <script src="../js/common-essay.js" defer></script>

    <!-- KaTeX auto-render -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ]
        });"></script>
</body>
</html>
